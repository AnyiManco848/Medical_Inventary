# Producción en UNA EC2 t3.micro (1 GB de RAM + 2 GB de swap).
# Solo Caddy publica puertos (80/443); db, backend y frontend quedan en la red interna.
# Las imágenes se construyen en el PC (deploy/aws/build-push-*.ps1) y se descargan de ECR.
#
# Uso en la EC2 (carpeta /opt/medical-inventary, con el archivo .env al lado):
#   bash deploy/aws/ec2/deploy.sh
# Variables: ver .env.prod.example

name: medical-inventary

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-MedicalInventary}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    # Ajustes para trabajar con ~256 MB de memoria
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    networks:
      - interna

  backend:
    image: ${ECR_REGISTRY:?Falta ECR_REGISTRY en .env}/${ECR_BACKEND_REPO:-medical-inventary-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Mismo origen que el frontend: Caddy sirve los dos bajo https://<DOMAIN>
      FRONTEND_URL: https://${DOMAIN:?Falta DOMAIN en .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-MedicalInventary}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUTO_INIT: ${AUTO_INIT:-false}
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      # Fotos de insumos y evidencias: persisten en el disco de la EC2 (incluidas en backup-db.sh)
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    networks:
      - interna

  frontend:
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPO:-medical-inventary-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      # "/" redirige a /login; /login responde 200
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    networks:
      - interna

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Falta ACME_EMAIL en .env}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados de Let's Encrypt: no borrar este volumen (hay límite de emisiones por semana)
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks:
      - interna

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge

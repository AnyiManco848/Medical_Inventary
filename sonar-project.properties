# Configuración de SonarCloud / SonarQube para MedicalInventary.
# El token NUNCA va en este archivo: se pasa como variable de entorno SONAR_TOKEN.
# Antes de analizar, genera la cobertura de backend y frontend desde la raíz:  npm run coverage:sonar
# Guías: backend/tests/README.md y frontend/tests/README.md (sección "Cobertura para SonarCloud").

# Proyecto y organización en SonarQube Cloud
sonar.projectKey=AnyiManco848_Medical_Inventary2
sonar.organization=anyimanco848
sonar.projectName=MedicalInventary
sonar.sourceEncoding=UTF-8

# --- Código analizado (calidad, bugs, vulnerabilidades y code smells) ---
sonar.sources=backend/src,frontend/app

# --- Pruebas ---
# Todo backend/tests y frontend/tests es código de prueba; solo los *.test.js / *.test.jsx cuentan
# como archivos de test (helpers, setup y stubs quedan como código de prueba, no de producción).
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.test.js,\
  frontend/tests/**/*.test.js,\
  frontend/tests/**/*.test.jsx

# --- Fuera del análisis completo: solo lo generado o binario, no es código del proyecto ---
#   **/node_modules/**  dependencias de terceros
#   **/coverage/**      reportes de cobertura generados
#   frontend/.next/**   build de Next.js generado
#   **/uploads/**       imágenes subidas por los usuarios
#   .scannerwork/**     carpeta de trabajo que genera el propio escáner
sonar.exclusions=**/node_modules/**,**/coverage/**,frontend/.next/**,**/uploads/**,.scannerwork/**

# --- Fuera de la COBERTURA (siguen en el análisis de calidad y seguridad) ---
# Son las mismas exclusiones de backend/vitest.config.mjs y frontend/vitest.config.mjs:
#   backend/src/index.js               solo conecta a la base y arranca el servidor; la lógica está en app.js
#   backend/src/config/initDB.js       migración que se corre a mano contra una base real
#   backend/src/config/seed*.js        datos semilla que se corren a mano contra una base real
#   backend/src/config/diagnostico.js  script de diagnóstico manual
#   frontend/app/layout.js             solo envuelve <html>/<body> e importa los estilos; sin lógica
sonar.coverage.exclusions=backend/src/index.js,\
  backend/src/config/initDB.js,\
  backend/src/config/seed*.js,\
  backend/src/config/diagnostico.js,\
  frontend/app/layout.js

# --- Reportes de cobertura (rutas SF: relativas a la raíz del repo, ver scripts/fix-lcov-paths.mjs) ---
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
